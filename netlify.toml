[build]
  command = "npm run build"
  publish = "dist/exel-profesional/browser"
  functions = "netlify/functions"

# Permite entrar directamente a las rutas manejadas por Angular, sin interferir
# con las rutas de las Netlify Functions.
[[redirects]]
  from = "/productos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/productos/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/carrito"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/index.html"
  status = 200

# Fallback de Angular SPA: permite abrir o refrescar cualquier ruta del sitio
# (por ejemplo /admin) sin que Netlify devuelva un 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
