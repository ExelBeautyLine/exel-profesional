[build]
  command = "npm run build"
  publish = "dist/exel-profesional/browser"
  functions = "netlify/functions"

# Permite entrar directamente a las rutas manejadas por Angular, sin interferir
# con las rutas de las Netlify Functions.
[[redirects]]
  from = "/productos"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/productos/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/carrito"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/index.html"
  status = 200

# Rutas SPA que deben resolverse a Angular al abrirlas o refrescarlas.
# Se declaran de forma específica para no interceptar archivos estáticos
# como /assets/* cuando se ejecuta Netlify Dev.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/informacion/*"
  to = "/index.html"
  status = 200
