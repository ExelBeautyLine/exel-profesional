<div class="login-container">

  <div class="login-card">

    <h1>Exel Profesional</h1>

    <h2>Panel de administración</h2>

    <form (ngSubmit)="iniciarSesion()">

      <div class="campo">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Ingresá tu email"
          required
        />

      </div>

      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresá tu contraseña"
          required
        />

      </div>

      <button
        type="submit"
        [disabled]="cargando"
      >

        {{ cargando ? 'Ingresando...' : 'Ingresar' }}

      </button>

      <p
        class="error"
        *ngIf="error"
      >
        {{ error }}
      </p>

    </form>

  </div>

</div>
