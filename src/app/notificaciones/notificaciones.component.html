<div class="notificaciones" aria-live="polite" aria-atomic="true">
  <article
    *ngFor="let notificacion of notificaciones.notificaciones$ | async"
    class="notificacion"
    [class.notificacion--exito]="notificacion.tipo === 'exito'"
    [class.notificacion--advertencia]="notificacion.tipo === 'advertencia'"
    [class.notificacion--error]="notificacion.tipo === 'error'"
    role="status"
  >
    <span class="notificacion-icono" aria-hidden="true">
      <span *ngIf="notificacion.tipo === 'exito'">&#10003;</span>
      <span *ngIf="notificacion.tipo === 'advertencia'">!</span>
      <span *ngIf="notificacion.tipo === 'error'">&#215;</span>
    </span>
    <p>{{ notificacion.mensaje }}</p>
    <button type="button" (click)="notificaciones.cerrar(notificacion.id)" aria-label="Cerrar aviso">&#215;</button>
  </article>
</div>
